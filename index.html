<script>
/* ---------- Data ---------- */
const DAY=864e5, d=s=>Date.parse(s+'T00:00:00Z');
const TODAY=d('2026-10-26');
const fmt=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
const fmtS=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const money=v=>'$'+v.toFixed(1)+'M';
const WS={clin:'Clinical Workflow',data:'Data Migration',int:'Integrations',infra:'Infrastructure & Cloud',train:'Training & Change',comp:'Compliance',pmo:'Program Office'};

const MS=[
 {id:'M1',name:'Program charter & governance live',ws:'pmo',plan:d('2026-03-16'),pre:[],lag:0,done:1},
 {id:'M2',name:'Cloud landing zone ready',ws:'infra',plan:d('2026-06-30'),pre:['M1'],lag:30,done:1},
 {id:'M3',name:'Clinical content build complete',ws:'clin',plan:d('2026-08-31'),pre:['M1'],lag:30,done:1},
 {id:'M4',name:'Data mapping signed off',ws:'data',plan:d('2026-09-15'),actual:d('2026-10-06'),pre:['M2'],lag:30,done:1},
 {id:'M5',name:'Migration mock load 2 passed',ws:'data',plan:d('2026-11-13'),slip:21,pre:['M4'],lag:30},
 {id:'M6',name:'Lab & pharmacy interfaces certified',ws:'int',plan:d('2026-11-27'),slip:14,pre:['M2'],lag:30},
 {id:'M7',name:'HIPAA security assessment closed',ws:'comp',plan:d('2026-12-11'),pre:['M2'],lag:30},
 {id:'M8',name:'Wave 1 super-users trained',ws:'train',plan:d('2026-12-04'),pre:['M3'],lag:30},
 {id:'M9',name:'Wave 1 go-live (2 hospitals)',ws:'clin',plan:d('2027-01-26'),pre:['M5','M6','M7','M8'],lag:45,gate:1},
 {id:'M10',name:'Wave 2 readiness gate',ws:'pmo',plan:d('2027-03-05'),pre:['M9'],lag:35},
 {id:'M11',name:'Wave 2 go-live (2 hospitals)',ws:'clin',plan:d('2027-04-13'),pre:['M10'],lag:30,gate:1},
 {id:'M12',name:'Wave 3 go-live (flagship)',ws:'clin',plan:d('2027-06-15'),pre:['M11'],lag:45,gate:1},
 {id:'M13',name:'Hypercare exit & legacy retired',ws:'infra',plan:d('2027-08-31'),pre:['M12'],lag:60}
];
MS.forEach(m=>{if(m.done&&!m.actual)m.actual=m.plan});
const BYID=Object.fromEntries(MS.map(m=>[m.id,m]));

const WSTREAMS=[
 {n:'Clinical Workflow',lead:'Dr. A. Rao',pct:62,rag:'a',note:'Order-set requests up 14; scope control in place.'},
 {n:'Data Migration',lead:'M. Fischer',pct:48,rag:'r',note:'Mock load 2 forecast 3 weeks late; duplicate MRNs at 3.1%.'},
 {n:'Integrations',lead:'P. Nair',pct:55,rag:'a',note:'Pharmacy interface vendor build 2 weeks behind.'},
 {n:'Infrastructure & Cloud',lead:'L. Okafor',pct:85,rag:'g',note:'Landing zone live; network upgrade at Harborview due Dec 5.'},
 {n:'Training & Change',lead:'S. Brandt',pct:40,rag:'a',note:'260 nurse-training hours per week short Dec to Mar.'},
 {n:'Compliance',lead:'J. Whitfield',pct:58,rag:'g',note:'Audit-logging finding being remediated.'}
];

const RAID=[
 {id:'R-01',t:'Risk',ws:'int',title:'Pharmacy interface vendor delivers certified build late',owner:'P. Nair',p:4,i:5,opened:d('2026-08-18'),mit:'Weekly vendor exec check-in; manual order fallback designed; SLA penalty clause invoked.'},
 {id:'R-02',t:'Risk',ws:'train',title:'Training capacity gap of 260 nurse hours/week, Dec to Mar',owner:'S. Brandt',p:4,i:4,opened:d('2026-09-02'),mit:'Contract 4 trainers; shift to 4-hour modular sessions; protect super-user time.'},
 {id:'R-03',t:'Risk',ws:'data',title:'Duplicate patient records (3.1%) fail mock load 3',owner:'M. Fischer',p:3,i:5,opened:d('2026-09-21'),mit:'Probabilistic matching sprint; HIM team clears top 8,000 duplicates before Nov 30.'},
 {id:'R-04',t:'Risk',ws:'clin',title:'Wave 1 cutover overlaps winter flu surge',owner:'Dr. A. Rao',p:3,i:4,opened:d('2026-09-30'),mit:'Move cutover weekend to Jan 23; add 20% hypercare floor-walkers.'},
 {id:'R-05',t:'Risk',ws:'comp',title:'Security assessment may flag audit-logging gaps',owner:'J. Whitfield',p:2,i:5,opened:d('2026-10-05'),mit:'Pre-assessment with external reviewer; logging patch in sprint 20.'},
 {id:'R-06',t:'Risk',ws:'clin',title:'Build analyst attrition at the EHR vendor',owner:'Dr. A. Rao',p:3,i:3,opened:d('2026-10-12'),mit:'Named backups in contract; knowledge-base documentation weekly.'},
 {id:'R-07',t:'Risk',ws:'infra',title:'Cloud egress costs above estimate',owner:'L. Okafor',p:3,i:2,opened:d('2026-10-14'),mit:'Reserved capacity purchase; archive tiering for imaging data.'},
 {id:'R-08',t:'Risk',ws:'clin',title:'14 clinic-specific order-set requests threaten scope',owner:'Dr. A. Rao',p:4,i:2,opened:d('2026-10-19'),mit:'Clinical council triage; defer to post-go-live release 1.1.'},
 {id:'I-01',t:'Issue',ws:'data',title:'Data mapping sign-off landed 3 weeks late',owner:'M. Fischer',p:5,i:4,opened:d('2026-09-15'),mit:'Mock load 2 re-planned; extra data engineers loaned from Cloud Platform.'},
 {id:'I-02',t:'Issue',ws:'train',title:'Three super-user roles vacant at Riverbend',owner:'S. Brandt',p:5,i:3,opened:d('2026-10-01'),mit:'Backfill requests approved by CNO; interim cover from Northgate.'},
 {id:'I-03',t:'Issue',ws:'pmo',title:'Forecast at completion is 7% above baseline',owner:'Program Director',p:5,i:3,opened:d('2026-10-13'),mit:'Contingency draw request in steering pack; scope trade-offs listed.'},
 {id:'I-04',t:'Issue',ws:'infra',title:'Landing zone security review finding',owner:'L. Okafor',p:5,i:2,opened:d('2026-06-10'),closed:1,mit:'Resolved in sprint 11.'},
 {id:'A-01',t:'Assumption',ws:'clin',title:'Clinical councils approve order sets within 10 working days',owner:'CMIO',p:2,i:3,opened:d('2026-03-20'),mit:'Tracked weekly; currently averaging 12 days.'},
 {id:'A-02',t:'Assumption',ws:'int',title:'No vendor release freeze overlaps go-live windows',owner:'P. Nair',p:2,i:3,opened:d('2026-04-08'),mit:'Confirmed through Q1 2027; revalidate Jan 15.'},
 {id:'D-01',t:'Dependency',ws:'infra',title:'Harborview network upgrade (Facilities) by Dec 5',owner:'Facilities Director',p:3,i:4,opened:d('2026-07-14'),mit:'Biweekly check with Facilities; temporary link as fallback.'},
 {id:'D-02',t:'Dependency',ws:'int',title:'State health information exchange onboarding slot (Feb 2027)',owner:'P. Nair',p:2,i:4,opened:d('2026-08-03'),mit:'Application submitted; slot confirmed in writing.'},
 {id:'D-03',t:'Dependency',ws:'train',title:'Union consultation on super-user shift changes by Nov 20',owner:'HR Business Partner',p:3,i:3,opened:d('2026-09-09'),mit:'Draft proposal shared; meeting set for Nov 4.'}
];
RAID.forEach(r=>{r.score=r.p*r.i;r.age=Math.round((TODAY-r.opened)/DAY);r.open=!r.closed;
 r.esc=r.open&&(r.score>=16||(r.age>45&&r.score>=12))});

const SITES=[
 {n:'Northgate General',wave:1,ready:82,su:90},{n:'St. Aurelia',wave:1,ready:74,su:78},
 {n:'Riverbend Community',wave:2,ready:58,su:55},{n:'Harborview',wave:2,ready:61,su:60},
 {n:'Meridian Central (flagship)',wave:3,ready:44,su:35}];
const BENEFITS=[
 {n:'Legacy data-centre cost avoided',u:'$M/yr',target:1.8,plan:0.5,act:0.4},
 {n:'Duplicate lab orders avoided',u:'%',target:18,plan:2,act:2},
 {n:'Pilot clinics on new documentation workflow',u:'clinics',target:12,plan:4,act:3},
 {n:'Clinician documentation time saved',u:'min/shift',target:25,plan:0,act:0},
 {n:'Claim denial reduction',u:'%',target:12,plan:0,act:0}];
const SPRINTS=[{s:'S14',c:62,dn:55},{s:'S15',c:60,dn:57},{s:'S16',c:64,dn:53},{s:'S17',c:58,dn:54},{s:'S18',c:66,dn:58},{s:'S19',c:64,dn:52}];
const TEAMS=[
 {n:'Clinical Informatics',ws:'clin',size:10,u:[96,98,104,108,102,95]},
 {n:'Data Engineering',ws:'data',size:8,u:[118,112,104,96,90,88]},
 {n:'Integration Engineering',ws:'int',size:7,u:[108,112,106,98,94,90]},
 {n:'Cloud Platform',ws:'infra',size:6,u:[84,80,78,76,72,70]},
 {n:'Training Team',ws:'train',size:9,u:[104,121,126,124,118,108]},
 {n:'Security & Compliance',ws:'comp',size:5,u:[92,100,96,88,82,80]},
 {n:'Change & Program Office',ws:'pmo',size:4,u:[90,94,96,98,92,90]},
 {n:'QA & Test',ws:'int',size:8,u:[100,106,112,114,104,96]}];
const MONTHS_H=['Nov','Dec','Jan','Feb','Mar','Apr'];
const PLAN_RAW=[.35,.5,.65,.75,.8,.85,.9,.95,1,1,.95,.9,.85,.8,.75,.65,.55,.4];
const PLAN_SCALE=14/PLAN_RAW.reduce((a,b)=>a+b,0);
const PLAN=PLAN_RAW.map(v=>v*PLAN_SCALE);
const ACT_F=[1.03,1.04,1.05,1.04,1.06,1.07,1.08,1.08];
const MONTH_LBL=['Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
const SPEND=PLAN.map((p,i)=>i<8?p*ACT_F[i]:p*1.08);
const cum=a=>{let s=0;return a.map(v=>s+=v)};
const CUM_PLAN=cum(PLAN), CUM_SPEND=cum(SPEND);
const FAC=CUM_SPEND[17], BASE=14, ACT_TD=CUM_SPEND[7], PLAN_TD=CUM_PLAN[7];
const BENEFIT_PER_MONTH=0.7, CARRY_PER_MONTH=0.85*0.6;

/* ---------- Logic ---------- */
function forecast(extra={}){
  const fc={},fl={};
  for(const m of MS){
    if(m.done){fc[m.id]=m.actual;fl[m.id]=null;continue}
    const own=m.plan+((m.slip||0)+(extra[m.id]||0))*DAY;
    let e=-Infinity;for(const p of m.pre)e=Math.max(e,fc[p]+m.lag*DAY);
    fc[m.id]=Math.max(own,e);
    fl[m.id]=Math.round((own-e)/DAY);
  }
  return {fc,fl};
}
const BASEF=forecast();
const firstOpen=ws=>MS.find(m=>!m.done&&m.ws===ws);
function scenarioExtra(msId,weeks,teamIdx,removed){
  const x={};
  if(msId&&weeks)x[msId]=(x[msId]||0)+weeks*7;
  if(teamIdx!=null&&removed){
    const t=TEAMS[teamIdx], m=firstOpen(t.ws);
    if(m)x[m.id]=(x[m.id]||0)+Math.round(removed/t.size*60);
  }
  return x;
}
const dd=(a,b)=>Math.round((a-b)/DAY);
function rag(s){return s==='r'?['r','Off track','■']:s==='a'?['a','At risk','▲']:['g','On track','●']}
const pill=(s,txt)=>{const [c,l,g]=rag(s);return `<span class="pill ${c}">${g} ${txt||l}</span>`};

function health(){
  const f=BASEF, w1=dd(f.fc.M9,BYID.M9.plan), end=dd(f.fc.M13,BYID.M13.plan);
  const floats=MS.filter(m=>!m.done&&f.fl[m.id]!=null).map(m=>f.fl[m.id]);
  const minFloat=Math.min(...floats);
  const critical=MS.filter(m=>!m.done&&f.fl[m.id]!=null&&f.fl[m.id]<=14&&m.pre.length);
  const sched=(w1>14||end>21)?'r':(w1>0||minFloat<14)?'a':'g';
  const v=(FAC/BASE-1)*100, bud=v>10?'r':v>3?'a':'g';
  const hi=RAID.filter(r=>r.open&&r.t!=='Assumption'&&r.score>=15), risk=hi.length>=8?'r':hi.length>=1?'a':'g';
  const ben=BENEFITS.filter(b=>b.plan>0), bp=ben.reduce((a,b)=>a+Math.min(b.act/b.plan,1),0)/ben.length*100;
  const bs=bp<70?'r':bp<90?'a':'g';
  const rd=SITES.reduce((a,s)=>a+s.ready,0)/SITES.length, ps=rd<50?'r':rd<80?'a':'g';
  const all=[sched,bud,risk,bs,ps];
  const overall=all.includes('r')?'r':all.includes('a')?'a':'g';
  return {w1,end,minFloat,critical,sched,v,bud,hi,risk,bp,bs,rd,ps,overall};
}

/* ---------- Charts ---------- */
function budgetChart(){
  const W=680,H=300,L=46,R=96,T=14,B=30,w=W-L-R,h=H-T-B,max=16;
  const x=i=>L+i*w/18, y=v=>T+h*(1-v/max);
  const pt=(arr,from,to)=>{let s=[];for(let i=from;i<=to;i++)s.push(`${x(i+1).toFixed(1)},${y(arr[i]).toFixed(1)}`);return s.join(' ')};
  let g='';
  for(let v=0;v<=16;v+=4)g+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">$${v}M</text>`;
  [0,3,6,9,12,15].forEach(i=>g+=`<text x="${x(i+1)}" y="${H-10}" text-anchor="middle">${MONTH_LBL[i]}</text>`);
  const tod=x(8);
  g+=`<line x1="${tod}" x2="${tod}" y1="${T}" y2="${T+h}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${tod+4}" y="${T+10}">Today</text>`;
  g+=`<polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 4" points="${x(0)},${y(0)} ${pt(CUM_PLAN,0,17)}"/>`;
  g+=`<polyline fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="2 3" points="${pt(CUM_SPEND,7,17)}"/>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${x(0)},${y(0)} ${pt(CUM_SPEND,0,7)}"/>`;
  g+=`<circle cx="${x(8)}" cy="${y(CUM_SPEND[7])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  for(let i=0;i<18;i++)g+=`<circle cx="${x(i+1)}" cy="${y(CUM_SPEND[i])}" r="9" fill="transparent"><title>${MONTH_LBL[i]}: plan ${money(CUM_PLAN[i])}, ${i<8?'actual':'forecast'} ${money(CUM_SPEND[i])}</title></circle>`;
  g+=`<text class="k" x="${x(18)+6}" y="${y(BASE)+4}">Plan ${money(BASE)}</text><text class="k" x="${x(18)+6}" y="${y(FAC)+4}" style="fill:var(--warn)">Fcst ${money(FAC)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative spend, plan versus actual and forecast">${g}</svg>
  <div class="legend"><span><i class="sw" style="background:var(--muted)"></i>Planned</span><span><i class="sw" style="background:var(--accent)"></i>Actual to date</span><span><i class="sw" style="background:var(--warn)"></i>Forecast</span></div>`;
}
function velocityChart(){
  const W=640,H=250,L=36,T=12,B=28,w=W-L-8,h=H-T-B,max=80,gw=w/SPRINTS.length;
  let g='';
  for(let v=0;v<=80;v+=20)g+=`<line class="axis" x1="${L}" x2="${W-8}" y1="${T+h*(1-v/max)}" y2="${T+h*(1-v/max)}"/><text x="${L-6}" y="${T+h*(1-v/max)+4}" text-anchor="end">${v}</text>`;
  SPRINTS.forEach((s,i)=>{
    const x0=L+i*gw+gw*.2, bw=gw*.28, hc=h*s.c/max, hd=h*s.dn/max;
    g+=`<rect x="${x0}" y="${T+h-hc}" width="${bw}" height="${hc}" fill="none" stroke="var(--muted)" stroke-width="1.5" rx="2"><title>${s.s}: committed ${s.c} points</title></rect>`;
    g+=`<rect x="${x0+bw+3}" y="${T+h-hd}" width="${bw}" height="${hd}" fill="var(--accent)" rx="2"><title>${s.s}: completed ${s.dn} points (${Math.round(s.dn/s.c*100)}% say/do)</title></rect>`;
    g+=`<text x="${x0+bw+1.5}" y="${H-10}" text-anchor="middle">${s.s}</text><text class="k" x="${x0+bw*1.5+3}" y="${T+h-hd-5}" text-anchor="middle">${Math.round(s.dn/s.c*100)}%</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Committed versus completed story points per sprint">${g}</svg>
  <div class="legend"><span><i class="sw" style="border:1.5px solid var(--muted)"></i>Committed points</span><span><i class="sw" style="background:var(--accent)"></i>Completed points (say/do % above)</span></div>`;
}
function timeline(f){
  const t0=d('2026-03-01'),t1=d('2027-09-30'),W=900,L=250,R=20,rowH=30,T=26,H=T+MS.length*rowH+8;
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R);
  let g='';
  ['2026-04-01','2026-07-01','2026-10-01','2027-01-01','2027-04-01','2027-07-01'].forEach(s=>{const X=x(d(s));
    g+=`<line class="axis" x1="${X}" x2="${X}" y1="${T-6}" y2="${H-6}"/><text x="${X+3}" y="14">${new Date(d(s)).toLocaleDateString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'})}</text>`});
  g+=`<line x1="${x(TODAY)}" x2="${x(TODAY)}" y1="${T-6}" y2="${H-6}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  MS.forEach((m,i)=>{
    const cy=T+i*rowH+rowH/2, fc=f.fc[m.id], slip=dd(fc,m.plan), fl=f.fl[m.id];
    const crit=!m.done&&fl!=null&&fl<=14&&m.pre.length;
    g+=`<text class="k" x="${L-10}" y="${cy+4}" text-anchor="end" ${crit?'style="font-weight:600"':''}>${m.id} ${m.name.length>30?m.name.slice(0,29)+'…':m.name}</text>`;
    if(slip>0)g+=`<line x1="${x(m.plan)}" x2="${x(fc)}" y1="${cy}" y2="${cy}" stroke="var(--crit)" stroke-width="3"/>`;
    g+=`<path d="M${x(m.plan)} ${cy-7}l7 7-7 7-7-7z" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"><title>${m.name}: planned ${fmt(m.plan)}</title></path>`;
    const fill=m.done?'var(--good)':crit?'var(--warn)':'var(--accent)';
    if(slip!==0||m.done)g+=`<path d="M${x(fc)} ${cy-7}l7 7-7 7-7-7z" fill="${fill}"><title>${m.name}: ${m.done?'completed':'forecast'} ${fmt(fc)}${slip>0?` (+${slip} days)`:''}</title></path>`;
    else g+=`<path d="M${x(m.plan)} ${cy-7}l7 7-7 7-7-7z" fill="${fill}"><title>${m.name}: forecast ${fmt(fc)}, float ${fl==null?'n/a':fl+' days'}</title></path>`;
  });
  return `<div class="scroll"><div style="min-width:760px"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Milestone timeline, planned versus forecast">${g}</svg></div></div>
  <div class="legend"><span>◇ Planned</span><span><i class="sw" style="background:var(--good)"></i>Completed</span><span><i class="sw" style="background:var(--accent)"></i>Forecast, has float</span><span><i class="sw" style="background:var(--warn)"></i>Forecast, 14 days float or less (bold label)</span><span><i class="sw" style="background:var(--crit)"></i>Slip beyond plan</span></div>`;
}

const TABS=[['summary','Summary'],['plan','Program plan'],['raid','RAID'],['money','Budget & capacity'],['delivery','Delivery'],['transform','Transformation'],['whatif','What-if'],['report','Status report'],['about','About']];
const tabsEl=document.getElementById('tabs'), panel=document.getElementById('panel');

function show(id,push){

  tabsEl.innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===id}" data-k="${k}">${l}</button>`).join('');
  panel.innerHTML=views[id]();
  if(push){try{history.replaceState(null,'','#'+id)}catch(e){try{location.hash=id}catch(_){}}}
  if(id==='raid')initRaid();
  if(id==='whatif')initWhatIf();
  if(id==='report')initReport();
}

    const [ty,ws,st,q]=ids.map(e=>e.value.trim().toLowerCase());
    const rows=RAID.filter(r=>(!ty||r.t.toLowerCase()===ty)&&(!ws||r.ws===ws)&&(!st||r.open)&&(!q||(r.title+r.owner).toLowerCase().includes(q))).sort((a,b)=>b.score-a.score);
    document.getElementById('f-count').textContent=rows.length+' items';
    body.innerHTML=rows.map(r=>{const s=r.score>=15?'r':r.score>=8?'a':'g';
      return `<tr><td class="num">${r.id}</td><td>${r.t}</td><td>${r.title}<div class="note">${WS[r.ws]} · ${r.mit}</div></td><td>${r.owner}</td><td class="n">${pill(s,String(r.score))}</td><td class="n num">${r.open?r.age+' d':'closed'}</td><td>${r.esc?'<span class="pill r">▲ Escalate</span>':''}</td></tr>`}).join('')||'<tr><td colspan="7" class="note">No items match.</td></tr>';
  }
  ids.forEach(e=>e.addEventListener('input',draw));draw();
}

let SCEN={ms:'M5',wk:0,tm:4,rm:0};
const scen=()=>scenarioExtra(SCEN.wk?SCEN.ms:null,SCEN.wk,SCEN.rm?SCEN.tm:null,SCEN.rm);
function scenImpact(){
  const f=forecast(scen());
  const w1=dd(f.fc.M9,BASEF.fc.M9), end=dd(f.fc.M13,BASEF.fc.M13);
  const cost=Math.max(0,end)/30*CARRY_PER_MONTH, ben=Math.max(0,w1)/30*BENEFIT_PER_MONTH;
  return {f,w1,end,cost,ben};
}

     <tr><td><b>Forecast at completion</b></td><td class="n num"><b>${money(FAC+x.cost)}</b></td><td class="n num ${cls(x.cost)}">+${((FAC+x.cost)/BASE*100-100).toFixed(1)}% vs plan</td></tr></tbody></table>
     ${SCEN.rm?`<p class="note" style="margin-top:8px">Removing ${SCEN.rm} of ${tm.size} from ${tm.n} delays ${tmMs?tmMs.id+' by '+Math.round(SCEN.rm/tm.size*60)+' days':'nothing (no open milestone)'}.</p>`:''}
     ${!SCEN.wk&&!SCEN.rm?'<p class="note" style="margin-top:8px">Baseline shown. Move a slider to test a scenario.</p>':''}`;
    const rows=MS.filter(m=>!m.done&&dd(x.f.fc[m.id],BASEF.fc[m.id])!==0);
    q('w-moves').innerHTML=rows.length?`<table><thead><tr><th>Milestone</th><th class="n">Baseline forecast</th><th class="n">Scenario</th><th class="n">Change</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${m.id} ${m.name}</td><td class="n num">${fmt(BASEF.fc[m.id])}</td><td class="n num">${fmt(x.f.fc[m.id])}</td><td class="n num delta-up">+${dd(x.f.fc[m.id],BASEF.fc[m.id])} d</td></tr>`).join('')}</tbody></table>`:'<p class="note">Nothing moves in the baseline scenario.</p>';
  }
  ['w-ms','w-wk','w-tm','w-rm'].forEach(i=>q(i).addEventListener('input',draw));
  q('w-reset').addEventListener('click',()=>{SCEN={ms:'M5',wk:0,tm:4,rm:0};initWhatIf()});
  draw();
}

function reportPdf(text){
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
  const M=48, PW=doc.internal.pageSize.getWidth(), PH=doc.internal.pageSize.getHeight(), W=PW-2*M;
  let y=M;
  const need=h=>{if(y+h>PH-M){doc.addPage();y=M}};
  text.split('\n').forEach((raw,i)=>{
    if(!raw.trim()){y+=6;return}
    const lead=raw.length-raw.trimStart().length, line=raw.trim();
    const head=/^[A-Z][A-Z &]+$/.test(line), title=i===0, overall=line.startsWith('OVERALL:');
    const size=title?15:head?11:overall?12:10;
    doc.setFont('helvetica',title||head||overall?'bold':'normal');doc.setFontSize(size);
    if(head){y+=6;need(size+4);doc.setDrawColor(11,110,110);doc.setLineWidth(.8);doc.line(M,y-size+2,M+W,y-size+2);y+=2}
    const ind=lead*3.5, parts=doc.splitTextToSize(line,W-ind);
    parts.forEach((p,j)=>{need(size*1.4);doc.text(p,M+ind+(j&&lead?10:0),y);y+=size*1.4});
  });
  return doc.output('blob');
}
function initReport(){
  const out=document.getElementById('r-out'), msg=document.getElementById('r-msg');
  const gen=()=>{
    try{out.textContent=buildReport();msg.textContent='Report generated at '+new Date().toLocaleTimeString();
      out.animate([{background:'var(--accent-soft)'},{background:'var(--bg)'}],{duration:900})}
    catch(e){msg.textContent='Could not build the report: '+e.message}
  };
  document.getElementById('r-gen').addEventListener('click',gen);
  document.getElementById('r-copy').addEventListener('click',async()=>{
    if(out.textContent.startsWith('No report'))gen();
    try{await navigator.clipboard.writeText(out.textContent);msg.textContent='Copied to clipboard'}
    catch(e){const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent='Text selected. Press Ctrl+C to copy.'}});
  const dl=document.getElementById('r-dl');
  try{
    /* Opened as a plain file outside claude.ai: no runtime, so save through a normal browser download. */
    const local=!(window.claude&&window.claude.use);
    const direct={save:async({filename,data})=>{
      const u=URL.createObjectURL(data), a=document.createElement('a');
      a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'}}};
    Promise.resolve(local?direct:window.claude.use('downloads')).then(api=>{
      if(!api||!document.body.contains(dl))return;
      dl.hidden=false;
      dl.addEventListener('click',async()=>{
        if(out.textContent.startsWith('No report'))gen();
        const day=new Date(TODAY).toISOString().slice(0,10);
        try{await api.save({filename:'meridian-status-report-'+day+'.pdf',data:reportPdf(out.textContent)});msg.textContent='Report saved'}
        catch(e){msg.textContent=e&&e.code==='declined'?'Download cancelled':'Could not create the PDF here. Use Copy text instead.'}
      });
    }).catch(()=>{});
  }catch(e){}
}
